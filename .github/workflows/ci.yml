name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validar dados e compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Instalar ferramentas de dados
        run: npm ci

      - name: Instalar dependências da app
        run: npm ci --prefix app

      # Primeiro os dados: um ingrediente que não existe passa no schema e parte a lista de compras.
      - name: Validar dados
        run: npm run validate

      - name: Gerar bundle
        run: npm run bundle

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Compilar a app
        run: npm run build --prefix app
