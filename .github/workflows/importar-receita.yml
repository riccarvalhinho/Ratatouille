name: Importar receita de um link

# Existe porque as sessões de Claude Code não conseguem abrir sites — o proxy de saída bloqueia-os.
# Os runners do GitHub têm internet normal, portanto vão eles buscar o conteúdo e deixam-no no
# repositório, onde uma sessão já o consegue ler.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Link da receita (site, YouTube ou TikTok)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: importar-receita
  cancel-in-progress: false

jobs:
  recolher:
    name: Recolher para data/inbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Só para metadados e legendas — o vídeo em si nunca é descarregado.
      - name: Instalar o yt-dlp, para transcrições de vídeo
        run: |
          python3 -m pip install --quiet --upgrade yt-dlp
          yt-dlp --version

      - name: Recolher o conteúdo do link
        run: npm run import:fetch -- "${{ inputs.url }}"

      - name: Commit do que foi recolhido
        run: |
          if [ -z "$(git status --porcelain data/inbox)" ]; then
            echo "Nada recolhido — ver o passo anterior."
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inbox
          git commit -m "Recolhe receita de ${{ inputs.url }}"
          git push
