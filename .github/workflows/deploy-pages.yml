name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação de cada vez, sem cancelar uma que já esteja a decorrer.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - run: npm ci
      - run: npm ci --prefix app

      - name: Validar dados
        run: npm run validate

      - name: Compilar (gera o bundle e a app)
        run: npm run build
        env:
          # O Pages de um repositório de projeto serve em /<repo>/, não na raiz.
          VITE_BASE: /${{ github.event.repository.name }}/

      # enablement liga o Pages na primeira execução, para não ser preciso ir às definições
      # do repositório. Só funciona em repositórios públicos no plano gratuito —
      # ver docs/adr/0005-repositorio-publico.md.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
